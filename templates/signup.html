<!DOCTYPE html>
<html>
<head>
    <title>Sign Up</title>

    <style>

        body{
            margin:0;
            font-family:Arial, sans-serif;
            background-image:url(
            'https://tse4.mm.bing.net/th/id/OIP.vUo3vrla2txarPe0hKiBcAHaEK?pid=Api&P=0&h=180'
            );

            background-size:cover;
            background-position:center;
            background-repeat:no-repeat;
            min-height:100vh;
        }

        /* ---------- NAVBAR ---------- */

        .navbar{
            position:fixed;
            top:0;
            left:0;
            width:100%;
            background:white;

            display:flex;
            justify-content:space-between;
            align-items:center;

            padding:15px 40px;
            box-shadow:0px 4px 15px
            rgba(0,0,0,0.2);

            z-index:1000;
            box-sizing:border-box;
        }

        .logo{
            color:#014784;
            margin:0;
            font-size:28px;
        }

        .nav-links{
            display:flex;
            gap:25px;
            margin-right:40px;
        }

        .nav-links a{
            text-decoration:none;
            color:#014784;
            font-size:18px;
            font-weight:bold;
            transition:0.3s;
        }

        .nav-links a:hover{
            color:#6e04df;
        }

        /* ---------- SIGNUP BOX ---------- */

        .signup-box{
            background:rgba(255,255,255,0.92);
            width:400px;
            padding:40px;
            border-radius:20px;
            box-shadow:0px 5px 20px
            rgba(0,0,0,0.3);

            position:absolute;
            top:55%;
            left:50%;
            transform:translate(-50%, -50%);
            text-align:center;
        }

        h2{
            color:#014784;
            margin-bottom:25px;
        }

        input{
            width:100%;
            padding:12px;
            margin:10px 0;
            border-radius:10px;
            border:1px solid #ccc;
            box-sizing:border-box;
            font-size:16px;
        }

        button{
            width:100%;
            padding:14px;
            margin-top:15px;
            border:none;
            border-radius:10px;
            background:#014784;
            color:white;
            font-size:17px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#002f5e;
        }

        .login-link{
            margin-top:20px;
            font-size:15px;
        }

        .login-link a{
            text-decoration:none;
            color:#014784;
            font-weight:bold;
        }

        .login-link a:hover{
            color:#6e04df;
        }

    </style>
</head>

<body>

    <!-- Navbar -->

    <div class="navbar">

        <h2 class="logo">
            AI Object Detection
        </h2>

        <div class="nav-links">

            <a href="/">Home</a>

            <a href="/upload">
                Upload
            </a>

            <a href="/dashboard">
                Dashboard
            </a>

            <a href="/about">
                About
            </a>

            <a href="/signup">
                Sign Up
            </a>

        </div>

    </div>


    <!-- Signup Form -->

    <div class="signup-box">

        <h2>Create Account</h2>

        <form>

            <input
                type="text"
                placeholder="Full Name"
                required
            >

            <input
                type="email"
                placeholder="Email Address"
                required
            >

            <input
                type="text"
                placeholder="Username"
                required
            >

            <input
                type="password"
                placeholder="Password"
                required
            >

            <input
                type="password"
                placeholder="Confirm Password"
                required
            >

            <button type="submit">
                Sign Up
            </button>

        </form>

        <div class="login-link">

            Already have an account?

            <a href="/">
                Login
            </a>

        </div>

    </div>

</body>
</html>
